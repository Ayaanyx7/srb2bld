name: Build SRB2Kart Android via srb2bld
on:
  workflow_dispatch: # Allows you to manually trigger this build

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Code
        uses: actions/checkout@v4

      - name: Install Linux Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make git coreutils curl gawk

      - name: Prepare Local Build Script
        run: |
          chmod +x srb2bld.sh

      - name: Compile APK Using Docker Build System
        run: |
          # Feeds '6' and an empty line to simulate pressing Enter on the branch prompt
          echo -e "6\n" | ./srb2bld.sh --android

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRB2Kart-Android-APK
          path: build/outputs/apk/**/*.apk
