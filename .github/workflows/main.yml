name: Build SRB2Kart Android via srb2bld
on:
  workflow_dispatch: # Allows you to manually trigger this build

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Code
        uses: actions/checkout@v4

      - name: Install Linux Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make git coreutils curl gawk

      - name: Prepare Local Build Script
        run: |
          chmod +x srb2bld

      - name: Compile APK Using Docker Build System
        run: |
          # TERM=xterm fixes the missing terminal layout error
          # SRB2BLD_NONINTERACTIVE overrides menus to let arguments work directly
          export TERM=xterm
          export SRB2BLD_NONINTERACTIVE="true"
          
          echo -e "6\n\n\n" | ./srb2bld --android

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRB2Kart-Android-APK
          # This searches EVERY folder in the workspace for the finished APK
          path: "**/*.apk"
